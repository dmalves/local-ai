version: '3.8'

name: local-ai

services:
  llama-backend:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llama-backend
    restart: unless-stopped
    devices:
      - "/dev/dri:/dev/dri"
    security_opt:
      - "label=disable"
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    volumes:
      - local-ai_llama-models:/models
    entrypoint: ["/app/llama-server", "--host", "0.0.0.0", "--port", "8080", "-m", "/models/${MODEL_FILE:-qwen2.5-coder-7b-instruct-q4_k_m.gguf}", "-ngl", "99", "--device", "Vulkan0"]
    networks:
      - local-ai_net

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://llama-backend:8080/v1
      - OPENAI_API_KEY=vllm-placeholder
    volumes:
      - local-ai_open-webui-data:/app/backend/data
    depends_on:
      - llama-backend
    networks:
      - local-ai_net

  docling-serve:
    image: quay.io/docling-project/docling-serve
    container_name: docling-serve
    restart: unless-stopped
    volumes:
      - local-ai_docling-cache:/root/.cache
    environment:
      - DOCLING_SERVE_MAX_SYNC_WAIT=6000  # Aumenta o tempo limite para 100 minutos (6000s)
      - OMP_NUM_THREADS=4                # Ajuste conforme o número de CPUs disponíveis
      - MKL_NUM_THREADS=4                # Ajuda na performance do processamento matemático
      - UVICORN_WORKERS=1                # OBRIGATÓRIO manter em 1 para evitar erros de tarefa perdida
    networks:
      - local-ai_net

networks:
  local-ai_net:
    driver: bridge

volumes:
  local-ai_llama-models:
    name: local-ai_llama-models
  local-ai_open-webui-data:
    name: local-ai_open-webui-data
  local-ai_docling-cache:
    name: local-ai_docling-cache
